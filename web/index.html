<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case File · Earned Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f3ec; --card:#fffdf8; --ink:#1d1b17; --muted:#7a7468; --rule:#e2dccf;
  --green:#2f7a4f; --green-bg:#e3f1e8; --amber:#b4541a; --amber-bg:#fbeadf;
  --violet:#6b3fa0; --violet-bg:#efe6f8; --grey-bg:#ece8df;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#16150f; --card:#1f1d17; --ink:#ece7da; --muted:#a39d8f; --rule:#34302a;
  --green:#7fcf9c; --green-bg:#1c3125; --amber:#f0a06c; --amber-bg:#3a2417;
  --violet:#c7a5ef; --violet-bg:#2b2238; --grey-bg:#2a2720;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
a{color:inherit}

.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0;color:var(--muted);font-size:13px}
.top b{color:var(--ink);text-transform:uppercase;letter-spacing:.1em;font-size:12px}

.hero{padding:40px 0 34px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.02;font-weight:700}
.hero h1 em{font-style:normal;color:var(--muted)}
.req{margin-top:16px;color:var(--muted);max-width:60ch}
.req .mono{color:var(--ink);margin-right:6px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:26px;gap:2px}
.bar span{display:block}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

section{padding:34px 0;border-top:1px solid var(--rule)}
h2{font-size:24px;margin-bottom:18px}
h2 small{font:400 13px "IBM Plex Sans";color:var(--muted);margin-left:8px;letter-spacing:0}

/* Safety rules */
.rules{display:grid;gap:8px}
.rule{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 16px}
.rule .n{font:500 12px "IBM Plex Mono";color:var(--muted)}
.rule .t{font-weight:600}
.rule .d{font-size:13px;color:var(--muted)}
.rule .s{text-align:right}
.rule .hit{font-size:12.5px;color:var(--muted);margin-top:4px}
.rule.triggered{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.pill{display:inline-block;font:500 10.5px/1 "IBM Plex Mono";text-transform:uppercase;letter-spacing:.07em;padding:5px 8px;border-radius:20px;white-space:nowrap}
.p-triggered,.p-contested{color:var(--amber);background:var(--amber-bg)}
.p-enforced,.p-proven,.p-supported{color:var(--green);background:var(--green-bg)}
.p-refused{color:var(--violet);background:var(--violet-bg)}
.p-weak-evidence,.p-unchecked{color:var(--muted);background:var(--grey-bg)}
.rule a{text-decoration:none;border-bottom:1px solid var(--rule)}

/* Decisions */
.dcard{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px 22px;margin-bottom:14px}
.dcard .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.dcard .row .mono{color:var(--muted)}
.dcard h3{font-size:22px;margin-bottom:6px}
.dcard p{margin:0 0 16px;color:var(--muted)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices label{cursor:pointer}
.choices input{position:absolute;opacity:0}
.choices span{display:inline-block;border:1px solid var(--rule);border-radius:6px;padding:8px 14px;font-size:14px;background:var(--paper)}
.choices input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.choices input:focus-visible+span{outline:2px solid var(--amber)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none}
summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
.ev{margin-top:10px;font-size:13px;display:grid;gap:10px}
.ev .lbl{color:var(--muted)}
.ev code{display:block;font:12px/1.5 "IBM Plex Mono";background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;white-space:pre-wrap;word-break:break-word;margin-top:3px}
.ev .wrong{border-left:2px solid var(--rule);padding-left:10px;color:var(--muted)}

/* Handled */
.handled{display:grid;gap:0;background:var(--card);border:1px solid var(--rule);border-radius:10px}
.handled>div{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 18px;border-bottom:1px solid var(--rule);align-items:baseline}
.handled>div:last-child{border-bottom:0}
.handled .x{font-size:13px;color:var(--muted)}

/* Sign */
.sign{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:22px}
.sign .meta{color:var(--muted);margin-bottom:16px}
.sign label.f{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
.sign input[type=text],.sign textarea{width:100%;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:9px 11px}
.sign textarea{min-height:60px;resize:vertical}
.go{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px}
.go button{font:600 15px "IBM Plex Sans";background:var(--ink);color:var(--paper);border:0;padding:12px 22px;border-radius:6px;cursor:pointer}
.go button:disabled{opacity:.35;cursor:not-allowed}
.go .why{font-size:13px;color:var(--muted)}
.warn{color:var(--amber)}
.log{margin-top:18px;font-size:13px}
.log div{display:flex;gap:12px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--rule)}
.log .mono{color:var(--muted)}
footer{padding:30px 0 60px;color:var(--muted);font-size:12.5px}
@media (max-width:640px){
  .rule{grid-template-columns:1fr;gap:6px}.rule .s{text-align:left}.rule .n{display:none}
  .handled>div{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><b>Case file</b> · AI reviews, a named human decides</span><span class="mono" id="meta"></span></div>
  <main id="app"></main>
  <footer>Reference implementation · Junction 2026, Earned Trust in AI Code · agent branch <span class="mono">ju26-issue-2297</span> of MessagePack-CSharp</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LBL = {"weak-evidence":"weak evidence","unchecked":"not checked"};
const pill = s => `<span class="pill p-${s}">${LBL[s]||s}</span>`;

async function main(){
  const c = await (await fetch("/api/case/2297")).json();
  const r = c.review, k = c.checks, ch = r.change;
  const snap = k.checks.find(x => x.id === "snapshot-shape");
  const decide = r.findings.filter(f => ["contested","refused"].includes(f.status));
  const other = r.findings.filter(f => !decide.includes(f));
  $("#meta").textContent = `commit ${k.head_commit.slice(0,8)} · evidence ${c.evidence_hash}`;

  $("#app").innerHTML = `
  <div class="hero">
    <h1>${k.files_total} files changed.<br><em>${decide.length} need you.</em></h1>
    <div class="req"><span class="mono">${esc(ch.requirement.id)}</span>${esc(ch.title)}. Written by an agent, reviewed by AI, signed by a person.</div>
    <div class="bar">
      <span style="flex:${snap.passed};background:var(--green)"></span>
      <span style="flex:${k.files_total - snap.passed - 1};background:var(--muted);opacity:.45"></span>
      <span style="flex:4;background:var(--amber)"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--green)"></i>${snap.passed} proven by machine</span>
      <span><i style="background:var(--muted);opacity:.45"></i>${k.files_total - snap.passed} explained by the reviewer</span>
      <span><i style="background:var(--amber)"></i>${decide.length} decisions for the owner</span>
    </div>
  </div>

  <section>
    <h2>Safety rules <small>${r.rules.filter(x=>x.state==="triggered").length} triggered on this change</small></h2>
    <div class="rules">${r.rules.map(x => `
      <div class="rule ${x.state}">
        <div class="n">${x.id}</div>
        <div><div class="t">${esc(x.rule)}</div><div class="d">${esc(x.detail)}</div></div>
        <div class="s">${pill(x.state)}<div class="hit">${x.ref ? `<a href="#${x.ref}">${esc(x.hit)}</a>` : esc(x.hit)}</div></div>
      </div>`).join("")}</div>
  </section>

  <section>
    <h2>Your decisions</h2>
    ${decide.map(f => `
      <div class="dcard" id="${f.id}">
        <div class="row">${pill(f.status)}<span class="mono">${f.id} · ${f.requirement ? esc(f.requirement) : "no requirement asks for this"}</span></div>
        <h3>${esc(f.short_title)}</h3>
        <p>${esc(f.oneliner)}</p>
        <div class="choices">${f.options.map(o => `<label><input type="radio" name="ans-${f.id}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>
        ${evidence(f)}
      </div>`).join("")}
  </section>

  <section>
    <h2>Handled without you</h2>
    <div class="handled">
      <div>${pill("proven")}<div>${snap.passed} generated files contain only the new attribute <div class="x">Re-runnable diff check, no AI involved.</div></div></div>
      ${other.map(f => `<div>${pill(f.status)}<div>${esc(f.short_title)}<div class="x">${esc(f.oneliner)}</div></div></div>`).join("")}
      <div>${pill("unchecked")}<div>${r.not_checked.length} things not checked<div class="x">${r.not_checked.map(n => esc(n.what)).join(" · ")}</div></div></div>
    </div>
  </section>

  <section>
    <h2>Sign-off</h2>
    <div class="sign">
      <div class="meta mono">${esc(ch.id)} → ${esc(ch.requirement.id)} · commit ${k.head_commit.slice(0,8)} · evidence ${c.evidence_hash}</div>
      <div class="choices">
        <label><input type="radio" name="dec" value="accept"><span>Accept</span></label>
        <label><input type="radio" name="dec" value="accept-with-conditions"><span>Accept with conditions</span></label>
        <label><input type="radio" name="dec" value="reject"><span>Send back to agent</span></label>
      </div>
      <label class="f" for="risk">Residual risk I accept</label>
      <textarea id="risk">Not compiled for a netstandard2.0 consumer; relying on reference-assembly metadata.</textarea>
      <label class="f" for="owner">Owner</label>
      <input type="text" id="owner" placeholder="Full name" autocomplete="name">
      <div class="go"><button id="signbtn" disabled>Sign</button><span class="why" id="why"></span></div>
      <div class="log" id="log"></div>
    </div>
  </section>`;

  const update = () => {
    const miss = [];
    decide.forEach(f => { if (!document.querySelector(`input[name="ans-${f.id}"]:checked`)) miss.push(f.id); });
    if (!document.querySelector('input[name="dec"]:checked')) miss.push("decision");
    if (!$("#risk").value.trim()) miss.push("residual risk");
    if ($("#owner").value.trim().split(/\s+/).length < 2) miss.push("full name");
    $("#signbtn").disabled = miss.length > 0;
    $("#why").textContent = miss.length ? "Needed: " + miss.join(", ") : "Your name goes on this change.";
  };
  document.addEventListener("input", update); document.addEventListener("change", update); update();

  $("#signbtn").onclick = async () => {
    const answers = {};
    decide.forEach(f => answers[f.id] = document.querySelector(`input[name="ans-${f.id}"]:checked`).value);
    const res = await fetch("/api/signoff", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({
      change:"2297", evidence_hash:c.evidence_hash, owner:$("#owner").value, answers,
      decision:document.querySelector('input[name="dec"]:checked').value, residual_risk:$("#risk").value})});
    const j = await res.json();
    $("#why").innerHTML = res.ok ? "Signed." : `<span class="warn">${esc(j.error)}</span>`;
    loadLog();
  };
  loadLog();
}

function evidence(f){
  return `<details><summary>Evidence</summary><div class="ev">
    ${f.evidence.map(e => `<div><span class="lbl">${esc(e.label)}</span><code>${esc(e.result)}</code>${e.rerun ? `<code>$ ${esc(e.rerun)}</code>` : ""}</div>`).join("")}
    ${f.refusal_reason ? `<div class="wrong">Why the AI refused: ${esc(f.refusal_reason)}</div>` : ""}
    ${f.would_be_wrong_if ? `<div class="wrong">Would be wrong if: ${esc(f.would_be_wrong_if)}</div>` : ""}
  </div></details>`;
}

async function loadLog(){
  const rows = await (await fetch("/api/signoffs")).json();
  $("#log").innerHTML = rows.slice().reverse().map(x =>
    `<div><span class="mono">${esc(x.at)}</span><b>${esc(x.owner)}</b><span>${esc(x.decision)}</span><span class="mono">${esc(x.evidence_hash)}</span></div>`).join("");
}
main();
</script>
</body>
</html>
